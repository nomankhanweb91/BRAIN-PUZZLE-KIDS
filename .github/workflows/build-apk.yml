name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Install Dependencies
        run: npm ci || npm install

      - name: 4. Build Web Application
        run: npm run build

      - name: 5. Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 6. Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 7. Accept Android SDK Licenses & Install SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "platforms;android-35" "platforms;android-36" "build-tools;34.0.0" "build-tools;35.0.0"

      - name: 8. Sync Capacitor to Android
        run: npx cap sync android

      - name: 9. Grant Execute Permission to Gradle Wrapper
        run: chmod +x android/gradlew

      - name: 10. Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: 11. Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Brain-Puzzle-Kids-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
